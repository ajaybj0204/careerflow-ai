# Free scheduler for frequent background work (Gmail polling fallback, alerts, reminders).
# Vercel Hobby crons run at most once a day, so this calls the tick endpoint every 15 minutes.
# Set repository secrets APP_URL (e.g. https://careerflow.vercel.app) and CRON_SECRET.
name: CareerFlow scheduler
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
  # Also run once whenever this file changes on main, which starts the schedule on new repos.
  push:
    branches: [main]
    paths: [".github/workflows/scheduler.yml"]
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run scheduler tick
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL/CRON_SECRET not set; skipping"; exit 0; fi
          URL="${APP_URL%/}/api/cron/tick"
          CODE=$(curl -sS -o /tmp/body -w "%{http_code}" -X POST -H "Authorization: Bearer $CRON_SECRET" "$URL" --max-time 90 || echo "000")
          echo "HTTP $CODE"
          if [ "$CODE" = "200" ]; then exit 0; fi
          if [ "$CODE" = "401" ]; then echo "::error::Tick rejected (401): the CRON_SECRET repository secret does not match the app's CRON_SECRET"; exit 1; fi
          echo "::error::Tick failed with HTTP $CODE. Check that APP_URL is the app's address, e.g. https://careerflow-ajaybj.vercel.app"; exit 1
