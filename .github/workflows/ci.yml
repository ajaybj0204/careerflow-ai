name: CI
on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run extension:build
      - run: npm run build
        env:
          SESSION_SECRET: ci-only-secret
          ALLOW_LOCAL_DB_IN_PRODUCTION: "true"
